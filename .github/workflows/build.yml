name: Build Fakeloc Loaders

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r27c
        run: |
          yes | sdkmanager --install "ndk;27.0.12077973" --sdk_root=$ANDROID_SDK_ROOT
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Configure
        run: |
          cmake -S standalone -B build/${{ matrix.abi }} \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-27 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/${{ matrix.abi }} -j4

      - name: Collect
        run: |
          mkdir -p out/${{ matrix.abi }}
          find build/${{ matrix.abi }} -name "*.so" -exec cp {} out/${{ matrix.abi }}/ \;
          ls -la out/${{ matrix.abi }}

      - uses: actions/upload-artifact@v4
        with:
          name: fakeloc-loaders-${{ matrix.abi }}
          path: out/${{ matrix.abi }}/